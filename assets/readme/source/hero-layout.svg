<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="title desc">
  <title id="title">Lora Skills</title>
  <desc id="desc">可安装、可复用的个人 Agent Skills 集合，lora 正在整理模块化技能文件夹，Mochi 递来最后一块模块。</desc>

  <defs>
    <clipPath id="canvas-clip">
      <rect width="1200" height="420" rx="28"/>
    </clipPath>
    <pattern id="paper-dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#8B5E34" opacity="0.12"/>
    </pattern>
  </defs>

  <g clip-path="url(#canvas-clip)">
    <rect width="1200" height="420" fill="#F7F4EE"/>
    <rect width="1200" height="420" fill="url(#paper-dots)"/>
    <circle cx="990" cy="186" r="270" fill="#E0A62F" opacity="0.13"/>
    <path d="M568 0H1200V420H705C650 339 625 245 632 138C635 86 613 38 568 0Z"
          fill="#FFFFFF" opacity="0.34"/>

    <g id="title-block" transform="translate(58 48)">
      <g id="category">
        <rect width="284" height="34" rx="17" fill="#1A1A1A"/>
        <circle cx="18" cy="17" r="5" fill="#E0A62F"/>
        <text x="32" y="23" fill="#F7F4EE" font-size="15" font-weight="700"
              font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
              letter-spacing="1.5">8 PERSONAL AGENT SKILLS</text>
      </g>

      <text x="0" y="112" fill="#1A1A1A" font-size="72" font-weight="800"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
            letter-spacing="-2">Lora Skills</text>
      <rect x="2" y="130" width="118" height="7" rx="3.5" fill="#E0A62F"/>

      <text x="0" y="184" fill="#34302B" font-size="28" font-weight="650"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
        可安装、可复用的个人 Agent Skills 集合
      </text>
      <text x="0" y="220" fill="#716A60" font-size="18" font-weight="600"
            font-family="ui-monospace, SFMono-Regular, Menlo, 'PingFang SC', monospace"
            letter-spacing="0.4">CODEX  ·  CLAUDE CODE  ·  CURSOR</text>

      <g id="skill-cues" transform="translate(0 265)">
        <g transform="translate(0 0)">
          <path d="M0 8Q0 0 8 0H62L72 10H116Q124 10 124 18V50Q124 58 116 58H8Q0 58 0 50Z"
                fill="#1A1A1A"/>
          <text x="62" y="38" text-anchor="middle" fill="#F7F4EE" font-size="18" font-weight="750"
                font-family="ui-monospace, SFMono-Regular, Menlo, monospace">BUILD</text>
        </g>
        <g transform="translate(138 0)">
          <path d="M0 8Q0 0 8 0H62L72 10H116Q124 10 124 18V50Q124 58 116 58H8Q0 58 0 50Z"
                fill="#E0A62F"/>
          <text x="62" y="38" text-anchor="middle" fill="#1A1A1A" font-size="18" font-weight="750"
                font-family="ui-monospace, SFMono-Regular, Menlo, monospace">DESIGN</text>
        </g>
        <g transform="translate(276 0)">
          <path d="M0 8Q0 0 8 0H62L72 10H116Q124 10 124 18V50Q124 58 116 58H8Q0 58 0 50Z"
                fill="#EDE6DA" stroke="#1A1A1A" stroke-width="2"/>
          <text x="62" y="38" text-anchor="middle" fill="#1A1A1A" font-size="18" font-weight="750"
                font-family="ui-monospace, SFMono-Regular, Menlo, monospace">WRITE</text>
        </g>
        <g transform="translate(414 0)">
          <path d="M0 8Q0 0 8 0H62L72 10H116Q124 10 124 18V50Q124 58 116 58H8Q0 58 0 50Z"
                fill="#8B5E34"/>
          <text x="62" y="38" text-anchor="middle" fill="#F7F4EE" font-size="18" font-weight="750"
                font-family="ui-monospace, SFMono-Regular, Menlo, monospace">SHIP</text>
        </g>
      </g>
    </g>

    <g id="character-subject">
      <image x="526" y="14" width="704" height="394"
             href="./hero-subject.png" xlink:href="./hero-subject.png"
             preserveAspectRatio="xMidYMid meet"/>
    </g>
  </g>

  <rect x="1.5" y="1.5" width="1197" height="417" rx="26.5"
        fill="none" stroke="#1A1A1A" stroke-width="3"/>
</svg>
