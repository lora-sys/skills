name = "asset-upload-signer"
main = "src/index.mjs"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# Non-secret values. Secrets are set with `wrangler secret put` (see references/setup.md).
[vars]
R2_PUBLIC_BASE_URL = "https://assets.lorasys.de5.net"
# Optional: comma-separated browser origins allowed to request a signature.
# ALLOWED_ORIGINS = "https://example.com,https://app.example.com"

# Rate limit: 10 signing requests per client IP per minute.
# namespace_id must be a unique positive integer within your Cloudflare account.
[[ratelimits]]
name = "UPLOAD_RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60
