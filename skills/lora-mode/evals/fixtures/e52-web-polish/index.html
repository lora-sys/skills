<!doctype html>
<html lang='en'>
<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <title>Help tooltip interaction</title>
  <style>
    .help {
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: white;
      padding: 8px 12px;
    }

    .tooltip {
      position: absolute;
      opacity: 0;
      transform: scale(0);
      transform-origin: center;
      transition: all 300ms ease-in;
      pointer-events: none;
    }

    .help:hover + .tooltip,
    .help:focus + .tooltip {
      opacity: 1;
      transform: scale(1);
    }
  </style>
</head>
<body>
  <button class='help' type='button' aria-describedby='help-tip'>Help</button>
  <span class='tooltip' id='help-tip' role='tooltip'>Your changes save automatically.</span>
</body>
</html>
