interface:
  display_name: "Teaching HTML Story Deck"
  short_description: "Create narrative teaching HTML with SVG diagrams and refined motion."
  default_prompt: "Turn the supplied topic into a standalone teaching HTML story deck. Start from the problem, generate content-specific inline SVG diagrams and restrained advanced motion, and reveal the final product or Skill only after the audience understands the method. After the deck passes `python scripts/validate_deck.py <deck>.html`, hand it to the html-stable-publish skill (Postplan) — ask the user to confirm the public upload before running `npx postplan upload` — and return the public link as part of the deliverable; deliver local-file-only when the user declines or asks for it."
